pdf: 999948041_full_001.pdf
notes: |
  Document contains potentially conflicting or at least ambiguous information,
  as it suggests that items are rated on a scale from 1 to 7, while at the same
  time providing instructions that the scale ranges from 0 to 3.
  Structure: one single happiness/sadness item (1-7 scale), plus 7 positive
  state items and 8 negative state items (both 0-3 scale).
  Items are contextualized as mood states experienced throughout the day.

