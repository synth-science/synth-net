pdf: 999921675_full_001.pdf
notes: |
  Document mentions a four scale/factor structure, but items are not labeled by 
  factor in the text. Structure therefore needs to be inferred from item content, 
  which is extremely challenging and error prone, even for human experts. Ground
  truth is based on the original paper. Items are prefixed.

exclude_from_testing: false
language: en
structure:
  - 4
  - 4
  - 3
  - 3
properties:
  - name: items_prefix
    not_null: true

scales:
  - scale_name: "Positive Reinforcement"
    items_context: null
    items:
    - item_text: "gives me important information"
    - item_text: "makes me feel good about myself"
    - item_text: "helps me realize I am competent"
    - item_text: "rewards me for good performance"
  - scale_name: "Evaluation"
    items_context: null
    items:
    - item_text: "compares me with other people"
    - item_text: "compares my performance standards or goals"
    - item_text: "shows me how my performance has changed over time"
    - item_text: "helps me understand how others view my performance"
  - scale_name: "Threat"
    items_context: null
    items:
    - item_text: "sometimes threatens me"
    - item_text: "makes me feel like I need to defend myself"
  - scale_name: "Development Focus"
    items_context: null
    items:
    - item_text: "says nothing when I do a good job"
    - item_text: "determines the areas in which I need education and development"